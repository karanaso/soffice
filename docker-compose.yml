services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_BACKEND: sqlite
      DATABASE_PATH: /data/soffice.db
      PORT: "3000"
    volumes:
      - soffice-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  soffice-data:
