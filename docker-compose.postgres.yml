services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: soffice
      POSTGRES_PASSWORD: soffice
      POSTGRES_DB: soffice
    volumes:
      - soffice-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soffice -d soffice"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_BACKEND: postgres
      DATABASE_URL: postgres://soffice:soffice@db:5432/soffice
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  soffice-postgres:
